name: Build Android APK (SE SMART CELL)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Signing: app/build.gradle.kts signs every variant with <root>/my-upload-key.jks,
      # which is committed to the repository, so checkout alone makes the APK
      # signable. A KEYSTORE_BASE64 secret overrides the committed keystore when set.
      - name: Prepare Firebase config and signing inputs
        shell: bash
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew

          # The secrets Gradle plugin reads .env; fall back to committed defaults.
          if [[ ! -f .env ]]; then
            cp .env.example .env
          fi

          # The google-services plugin expects app/google-services.json. Prefer the
          # secret when configured, otherwise reuse the config committed in the repo.
          if [[ -n "${FIREBASE_GOOGLE_SERVICES_JSON_B64:-}" ]]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
          elif [[ ! -f app/google-services.json && -f 'app/google-services (1).json' ]]; then
            cp 'app/google-services (1).json' app/google-services.json
          fi

          # Optional: replace the committed upload keystore with the secret one.
          if [[ -n "${KEYSTORE_BASE64:-}" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          fi

          # Guard: a keystore from KEYSTORE_BASE64 whose password does not match
          # KEYSTORE_PASSWORD (default "android" from app/build.gradle.kts) would
          # abort packaging. Validate it; on mismatch fall back to the committed
          # keystore so CI still produces a signed APK.
          effective_pass="${KEYSTORE_PASSWORD:-android}"
          if ! keytool -list -keystore my-upload-key.jks -storepass "$effective_pass" 2>/dev/null | grep -q "^upload,"; then
            echo "::warning::Keystore tidak cocok dengan password/alias signing — memakai keystore ter-commit di repo."
            git checkout -- my-upload-key.jks
            if ! keytool -list -keystore my-upload-key.jks -storepass android 2>/dev/null | grep -q "^upload,"; then
              echo "::error::Keystore ter-commit juga tidak valid dengan password 'android'."
              exit 1
            fi
          fi

      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew --no-daemon --no-configuration-cache --stacktrace assembleDebug

      # if-no-files-found: error doubles as the "APK was created" check.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SE-SMART-CELL-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
