name: Build Android APK (SE SMART CELL)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build APK and run unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Keystore TIDAK lagi ter-commit di repo (diputar karena key lama bocor).
      # CI memakai secret KEYSTORE_BASE64 bila tersedia; kalau belum diisi,
      # keystore sementara dibuat supaya CI tetap menghasilkan artefak — tetapi
      # APK dari keystore sementara TIDAK bisa meng-update instalasi sebelumnya.
      - name: Prepare Firebase config and signing keystore
        shell: bash
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew

          # The secrets Gradle plugin reads .env; fall back to committed defaults.
          if [[ ! -f .env ]]; then
            cp .env.example .env
          fi

          # The google-services plugin expects app/google-services.json. Prefer the
          # secret when configured, otherwise reuse the config committed in the repo.
          if [[ -n "${FIREBASE_GOOGLE_SERVICES_JSON_B64:-}" ]]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
          elif [[ ! -f app/google-services.json && -f 'app/google-services (1).json' ]]; then
            cp 'app/google-services (1).json' app/google-services.json
          fi

          if [[ -n "${KEYSTORE_BASE64:-}" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > se-smart-cell.jks
          else
            echo "::warning::Secret KEYSTORE_BASE64 belum diisi — membuat keystore sementara. APK ini TIDAK bisa meng-update instalasi sebelumnya."
            keytool -genkeypair -keystore se-smart-cell.jks -alias upload \
              -storepass "${KEYSTORE_PASSWORD:-android}" -keypass "${KEYSTORE_PASSWORD:-android}" \
              -dname "CN=SE SMART CELL, O=SE SMART CELL, C=ID" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Run unit tests
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/se-smart-cell.jks
        run: ./gradlew --no-daemon --no-configuration-cache testDebugUnitTest

      - name: Build debug APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/se-smart-cell.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: ./gradlew --no-daemon --no-configuration-cache --stacktrace assembleDebug

      # if-no-files-found: error doubles as the "APK was created" check.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SE-SMART-CELL-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
